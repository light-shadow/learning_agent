[project]
name = "tool-governance-demo"
version = "0.1.0"
description = "面向教学的 Agent 工具治理 Runtime"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "openai>=1.40,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]
