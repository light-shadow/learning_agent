[project]
name = "self-study-agent"
version = "0.1.0"
description = "本地自学 Agent CLI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4==4.12.3",
    "httpx==0.27.2",
    "pydantic==2.10.4",
    "pypdf==5.9.0",
    "python-docx==1.2.0",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
