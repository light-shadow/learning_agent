[project]
name = "self-study-agent"
version = "0.1.0"
description = "面向 AI Agent 架构学习的本地 PDF 自学 Agent"
requires-python = ">=3.12,<3.14"
dependencies = ["httpx==0.27.2", "pydantic==2.10.4", "pypdf==5.9.0"]

[dependency-groups]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
