[project]
name = "login-hybrid-rag"
version = "0.1.0"
description = "基于 LlamaIndex 的登录资料混合检索演示"
requires-python = ">=3.10"
dependencies = [
    "llama-index-core>=0.12,<0.15",
    "llama-index-embeddings-huggingface>=0.5,<0.7",
    "llama-index-llms-openai-like>=0.3,<0.7",
    "rank-bm25>=0.2.2,<0.3",
    "jieba>=0.42.1,<0.43",
    "torch>=2.4",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
